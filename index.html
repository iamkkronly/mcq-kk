<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rayflix AI Interview MCQ Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Orbitron', sans-serif;
      background: radial-gradient(circle, #0f172a, #020617);
      color: #e0f2fe;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 800px;
      margin-top: 4vh;
      background: rgba(30, 41, 59, 0.95);
      padding: 2rem 2.5rem;
      border-radius: 20px;
      box-shadow: 0 0 30px #38bdf8aa;
      backdrop-filter: blur(10px);
    }

    h1 {
      text-align: center;
      color: #38bdf8;
      font-size: 2.2rem;
      margin-bottom: 1rem;
      text-shadow: 0 0 10px #38bdf8;
    }

    input[type="text"], select {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 1.1rem;
      background: #1e293b;
      color: #f1f5f9;
      box-shadow: 0 0 8px #0ea5e9;
      outline: none;
      margin-bottom: 1rem;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      margin-top: 1rem;
      border-radius: 14px;
      border: none;
      background: linear-gradient(to right, #0ea5e9, #38bdf8);
      color: #0f172a;
      cursor: pointer;
      transition: transform 0.2s ease-in-out;
    }

    button:hover {
      transform: scale(1.05);
    }

    .question {
      margin-top: 1.5rem;
      padding: 1rem;
      background: #0f172a;
      border-left: 5px solid #38bdf8;
      border-radius: 10px;
      box-shadow: 0 0 10px #0ea5e9;
    }

    .options label {
      display: block;
      margin: 0.5rem 0;
      padding: 8px 12px;
      background: #1e293b;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .options label:hover {
      background: #0ea5e9;
      color: #0f172a;
    }

    .result {
      margin-top: 2rem;
      font-size: 1.5rem;
      color: #fbbf24;
      text-align: center;
      text-shadow: 0 0 10px #fbbf24;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Rayflix AI Interview MCQ Generator</h1>

    <label for="languageSelect">Choose Language:</label>
    <select id="languageSelect">
      <option value="English">English</option>
      <option value="Hindi">Hindi</option>
      <option value="Bengali">Bengali</option>
      <option value="Tamil">Tamil</option>
      <option value="Telugu">Telugu</option>
      <option value="Marathi">Marathi</option>
      <option value="Gujarati">Gujarati</option>
      <option value="Kannada">Kannada</option>
    </select>

    <input type="text" id="topicInput" placeholder="Enter topic e.g. JavaScript, AI, Networking etc." />
    <button onclick="startTest()">Start Test</button>

    <div id="quiz"></div>
    <button id="submitBtn" onclick="submitQuiz()" style="display:none;">Submit Test</button>
    <div class="result" id="result"></div>
  </div>

  <script>
    const apiKey = "AIzaSyAgIPiDW0xo05XEX1De4VWVYJmWCOWartU";
    const totalQuestions = 5;
    let questions = [];

    async function fetchQuestion(topic, index) {
      const selectedLang = document.getElementById("languageSelect").value;
      const langNote = selectedLang === "English" ? "" : `Translate everything in ${selectedLang}.`;

      const prompt = `Generate one technical interview MCQ about ${topic} with 6 options labeled A-F and clearly mention the correct answer in this format:
Q: <question>
A) option 1
B) option 2
C) option 3
D) option 4
E) option 5
F) option 6
Answer: <correct letter>
${langNote}`;

      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }]
        })
      });

      const data = await res.json();
      const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
      return parseMCQ(text, index);
    }

    function parseMCQ(text, index) {
      const lines = text.split("\n").filter(Boolean);
      const questionText = lines.find(line => line.startsWith("Q:")).replace("Q: ", "");
      const options = lines.slice(1, 7).map(line => line.substring(3));
      const correct = lines.find(line => line.startsWith("Answer:")).replace("Answer: ", "").trim();
      return { id: index, question: questionText, options: options, correct: correct };
    }

    async function startTest() {
      const topic = document.getElementById("topicInput").value.trim();
      if (!topic) {
        alert("Topic toh bhai bhar!");
        return;
      }

      document.getElementById("quiz").innerHTML = `<p>Generating ${totalQuestions} questions on "${topic}"...</p>`;
      questions = [];

      for (let i = 0; i < totalQuestions; i++) {
        const q = await fetchQuestion(topic, i);
        questions.push(q);
      }

      renderQuiz();
      document.getElementById("submitBtn").style.display = "block";
    }

    function renderQuiz() {
      const quizContainer = document.getElementById("quiz");
      quizContainer.innerHTML = questions.map(q => `
        <div class="question">
          <strong>${q.id + 1}. ${q.question}</strong>
          <div class="options">
            ${q.options.map((opt, idx) => `
              <label>
                <input type="radio" name="q${q.id}" value="${String.fromCharCode(65 + idx)}" />
                ${String.fromCharCode(65 + idx)}) ${opt}
              </label>
            `).join("")}
          </div>
        </div>
      `).join("");
    }

    function submitQuiz() {
      let score = 0;
      questions.forEach(q => {
        const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
        if (selected && selected.value === q.correct) {
          score++;
        }
      });
      document.getElementById("result").textContent = `Your Score: ${score} / ${totalQuestions}`;
      document.getElementById("submitBtn").disabled = true;
    }
  </script>
</body>
</html>
